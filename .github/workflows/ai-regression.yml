name: AI regression checks

on:
  pull_request:
    paths:
      - "dokumen.js"
      - "AI_REGRESSION_TESTS.md"
      - "tests/ai-gemini-retry.test.mjs"
      - "tests/gemini-json-repair.test.mjs"
      - "supabase/functions/**"
      - ".github/workflows/ai-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-gemini-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check document JavaScript syntax
        run: node --check dokumen.js
      - name: Run Gemini retry regression tests
        run: node --test tests/ai-gemini-retry.test.mjs
      - name: Run Gemini JSON repair regression tests
        run: node --test tests/gemini-json-repair.test.mjs

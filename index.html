<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#073b70">
  <title>AZX Office</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        linear-gradient(135deg, rgba(3, 28, 57, .78), rgba(5, 65, 112, .68)),
        url("https://www.alcedis.de/sites/default/files/styles/full_size/public/2025-05/AdobeStock_1001395080.jpeg?itok=JxsKBw1h")
        center center / cover no-repeat fixed,
        #073b70;
    }
    .welcome {
      width: min(100%, 520px);
      padding: 48px 30px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 20px;
      background: rgba(3, 34, 66, .62);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      box-shadow: 0 18px 55px rgba(0,0,0,.24);
    }
    .welcome h1 {
      margin: 0 0 14px;
      color: #fff;
      font-size: clamp(25px, 5vw, 34px);
      line-height: 1.25;
      letter-spacing: .5px;
    }
    .welcome p {
      margin: 0 0 30px;
      color: #d9ecff;
      font-size: 15px;
      line-height: 1.6;
    }
    .continue {
      display: flex;
      min-height: 58px;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 22px;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 12px;
      background: #fff;
      color: #07508a;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(0,0,0,.18);
      transition: transform .18s ease, background .18s ease;
    }
    .continue:hover, .continue:focus-visible {
      background: #eaf5ff;
      transform: translateY(-2px);
      outline: 2px solid #fff;
      outline-offset: 3px;
    }
    .arrow { font-size: 22px; line-height: 1; }
    .footer {
      margin-top: 28px;
      color: #c4def5;
      font-size: 12px;
      letter-spacing: 1.5px;
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .welcome { padding: 40px 22px; }
    }
  </style>
</head>
<body>
  <main class="welcome">
    <h1>SELAMAT DATANG DI AZX Office</h1>
    <p>Sistem administrasi dan pengembangan aplikasi .</p>
    <a class="continue" href="dokumen.html">
      <span>Lanjutkan</span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
    <div class="footer">AZX OFFICE · ADMINISTRASI</div>
  </main>
</body>
</html>
